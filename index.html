<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#16a34a"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Passo a Passo – Meta de caminhada</title>
<style>
:root{--bg:#f4f7f4;--cd:#fff;--tx:#14221a;--mu:#5f6f66;--pr:#16a34a;--or:#f97316;--bd:#e0e8e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1611;--cd:#17221b;--tx:#e8f0ea;--mu:#9aab9f;--pr:#4ade80;--or:#fb923c;--bd:#26342b}}
:root[data-theme="dark"]{--bg:#0e1611;--cd:#17221b;--tx:#e8f0ea;--mu:#9aab9f;--pr:#4ade80;--or:#fb923c;--bd:#26342b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
main{max-width:520px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 10px}
h1{font-size:20px;margin:0}
.chip{background:var(--cd);border:1px solid var(--bd);border-radius:99px;padding:4px 10px;font-weight:600;font-size:14px;margin-left:6px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px}
.mu{color:var(--mu)}.sm{font-size:13px}.c{text-align:center}.big{font-size:28px;font-weight:800}
button,input,textarea{font:inherit;color:inherit}
button{border:0;border-radius:12px;padding:10px 14px;background:var(--pr);color:#fff;font-weight:600;min-height:44px}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:44px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--or);border-radius:9px}
.rb{fill:none;stroke:var(--bd);stroke-width:12}.rf{fill:none;stroke:var(--pr);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;font-size:12px;padding:6px 0}nav button.on{color:var(--pr)}nav span{display:block;font-size:20px}
#ts{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#14221a;color:#fff;border-radius:12px;padding:12px;opacity:0;pointer-events:none;transition:.3s;text-align:center;z-index:9}#ts.on{opacity:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal b{font-size:12px;color:var(--mu)}
.cal button{padding:0;min-height:38px;background:var(--bg);color:var(--tx);font-weight:500;border:1px solid transparent}
.cal .part{background:color-mix(in srgb,var(--pr) 25%,var(--bg))}.cal .hit{background:color-mix(in srgb,var(--or) 25%,var(--bg))}.cal .tod{border-color:var(--pr)}
.wk{display:flex;gap:6px;height:110px}.wk div{flex:1;text-align:center;font-size:12px;display:flex;flex-direction:column;justify-content:flex-end}.wk i{display:block;border-radius:6px 6px 0 0;background:var(--bd);min-height:3px;margin-bottom:2px}.wk .h i{background:var(--pr)}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bd div{text-align:center;font-size:12px;padding:8px 4px;border:1px solid var(--bd);border-radius:12px;opacity:.4}.bd .ok{opacity:1;border-color:var(--or)}.bd span{display:block;font-size:26px}
.ch{width:100%}.ln{fill:none;stroke:var(--pr);stroke-width:2}.tl{stroke:var(--or);stroke-dasharray:4;stroke-width:1}.dt{fill:var(--pr)}
</style>
</head>
<body>
<main>
<header><h1>🚶 Passo a Passo</h1><div><span class="chip" id="st"></span><span class="chip" id="pt"></span></div></header>
<div id="m"></div>
</main>
<div id="ts"></div>
<nav>
<button onclick="nv(0)"><span>🏠</span>Hoje</button>
<button onclick="nv(1)"><span>🔥</span>Ofensiva</button>
<button onclick="nv(2)"><span>📈</span>Evolução</button>
<button onclick="nv(3)"><span>⚙️</span>Ajustes</button>
</nav>
<script>
const KEY='passoapasso:v1',$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),
k=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>k(new Date()),
def=()=>({v:1,cfg:{goal:30,mg:20,sw:'',tw:'',h:'',n:false,r:['07:00','18:00']},days:{},weights:{},timer:null,fl:''}),
LV=['Iniciante','Caminhante','Persistente','Imparável','Atleta','Lenda'];
let S,tab=0,sel=today(),vm=0,tt,armed=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=Object.assign(def(),S||{});S.cfg=Object.assign(def().cfg,S.cfg);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},
hit=r=>!!r&&r.min>=(r.g||S.cfg.goal);

function calc(){let st=0,best=0,pts=0,tot=0,km=0;const ds=Object.keys(S.days).sort();
 if(ds.length)for(const d=new Date(ds[0]+'T12:00:00'),e=today();k(d)<=e;d.setDate(d.getDate()+1)){const key=k(d),r=S.days[key];
  if(r){tot+=r.min;km+=r.km||0;pts+=r.min}
  if(hit(r)){st++;best=Math.max(best,st);pts+=20+Math.min(st,10)*2}else if(key!==e)st=0}
 return{st,best,pts,tot,km,lvl:Math.floor(pts/300)+1}}
function ws(){const a=Object.entries(S.weights).sort(),cur=a.length?a[a.length-1][1]:0,sw=+S.cfg.sw||(a.length?a[0][1]:0);return{a,cur,sw,lost:cur&&sw?Math.max(0,+(sw-cur).toFixed(1)):0}}
const mh=p=>Object.keys(S.days).filter(d=>d.startsWith(p)&&hit(S.days[d])).length,
BD=[['👟','Primeiro passo',c=>c.tot>0],['🔥','3 dias seguidos',c=>c.best>=3],['🔥','Semana de fogo (7)',c=>c.best>=7],['🏅','14 dias seguidos',c=>c.best>=14],['👑','30 dias seguidos',c=>c.best>=30],['⏱️','5 horas andadas',c=>c.tot>=300],['🏃','20 horas andadas',c=>c.tot>=1200],['⭐','1000 pontos',c=>c.pts>=1000],['⚖️','−1 kg',(c,w)=>w.lost>=1],['🏆','−5 kg',(c,w)=>w.lost>=5],['📅','Desafio do mês',()=>mh(today().slice(0,7))>=S.cfg.mg],['💎','Nível 5',c=>c.lvl>=5]];

function toast(m){const t=$('ts');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}
function notify(t,b){toast(t+' '+b);try{navigator.vibrate&&navigator.vibrate([150,80,150])}catch(e){}
 try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.2)}catch(e){}
 if(S.cfg.n)try{navigator.serviceWorker.getRegistration().then(r=>r?r.showNotification(t,{body:b,icon:'icon-192.png',vibrate:[150,80,150]}):new Notification(t,{body:b})).catch(()=>{})}catch(e){try{new Notification(t,{body:b})}catch(e){}}}
function ask(id,fn,el){if(armed===id){armed=null;fn()}else{armed=id;const t=el.textContent;el.textContent='Toque de novo para confirmar';setTimeout(()=>{if(armed===id){armed=null;el.textContent=t}},3500)}}

function add(m,km){const r=S.days[sel]||(S.days[sel]={min:0,km:0,g:S.cfg.goal}),was=hit(r);r.min+=m;r.km=+((r.km||0)+(km||0)).toFixed(2);save();render();
 if(!was&&hit(r))notify('🎉 Meta batida!','Ofensiva: '+calc().st+' dia(s) 🔥');else toast('Registrado ✔️')}
const ad=()=>{const m=Math.round(+$('cm').value),km=+$('ck').value;m>0||km>0?add(m>0?m:0,km):toast('Informe os minutos')},
zr=()=>{delete S.days[sel];save();render()},rs=()=>{S=def();save();sel=today();render()},
pw=()=>{const v=+$('wi').value;if(v>0){S.weights[sel]=v;save();render();toast('Peso salvo ⚖️')}},
up=()=>{sc('goal',S.cfg.goal+5);render()};
function tg(){if(S.timer&&S.timer.s){const m=Math.round((Date.now()-S.timer.s)/60000);S.timer=null;sel=today();m>0?add(m,0):(save(),render())}else{S.timer={s:Date.now()};save();render()}}
function tick(){const e=$('tm');if(!e)return;const s=S.timer&&S.timer.s?Math.floor((Date.now()-S.timer.s)/1000):0;e.textContent=pad(Math.floor(s/60))+':'+pad(s%60)}
function sc(key,v){if(key==='goal'&&!(+v>0))return toast('Meta inválida');
 if(/^r\d$/.test(key))S.cfg.r[+key[1]]=v;else S.cfg[key]=v===''?'':+v;
 const r=S.days[today()];if(key==='goal'&&r&&!hit(r))r.g=S.cfg.goal;save();toast('Salvo ✔️')}
async function tn(){S.cfg.n=!S.cfg.n;try{if(S.cfg.n&&'Notification' in window&&Notification.permission==='default')await Notification.requestPermission()}catch(e){}save();render()}
function chk(){if(!S.cfg.n)return;const n=new Date(),m=n.getHours()*60+n.getMinutes(),c=calc(),r=S.days[today()];if(hit(r))return;
 const left=Math.max(S.cfg.goal-(r?r.min:0),0);
 [...S.cfg.r.map(t=>[t,'Faltam '+left+' min para a meta de hoje. Bora! 💪']),['20:30',c.st?'Sua ofensiva de '+c.st+' dia(s) está em risco! 🔥':'Ainda dá tempo de bater a meta de hoje!']].forEach(([t,msg])=>{
  const [h,i]=String(t).split(':'),T=Number(h)*60+Number(i),key=today()+t;if(m>=T&&m<T+20&&S.fl!==key){S.fl=key;save();notify('Passo a Passo',msg)}})}

async function ex(){const t=JSON.stringify(S),f='passoapasso-'+today()+'.json';
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=f;document.body.appendChild(a);a.click();a.remove();return toast('Backup baixado ✅')}catch(e){}
 const b=$('bk');b.value=t;b.select();try{document.execCommand('copy');toast('Backup copiado! Cole em uma nota ou mensagem')}catch(e){toast('Copie o texto abaixo')}}
function imp(t){try{const o=JSON.parse(t);if(!o||!o.days)throw 0;
 for(const d in o.days){const a=S.days[d],b=o.days[d];if(!a||b.min>a.min)S.days[d]=b}
 Object.assign(S.weights,o.weights||{});S.cfg=Object.assign(S.cfg,o.cfg||{});save();render();toast('Backup importado ✅')}catch(e){toast('Backup inválido ⚠️')}}
async function fi(el){try{imp(await el.files[0].text())}catch(e){toast('Não consegui ler o arquivo')}}

function cal(){const b=new Date();b.setDate(1);b.setMonth(b.getMonth()+vm);const y=b.getFullYear(),mo=b.getMonth(),n=new Date(y,mo+1,0).getDate();
 let h='<div class="cal">'+[...'DSTQQSS'].map(x=>`<b>${x}</b>`).join('')+'<i></i>'.repeat(b.getDay()),hits=0;
 for(let d=1;d<=n;d++){const key=y+'-'+pad(mo+1)+'-'+pad(d),r=S.days[key],ok=hit(r);if(ok)hits++;
  h+=`<button class="${ok?'hit':r?'part':''}${key===today()?' tod':''}" ${key>today()?'disabled':''} onclick="go('${key}')">${ok?'🔥':d}</button>`}
 return[h+'</div>',hits]}
function wch(a,tw){if(a.length<2)return'<p class="mu sm">Registre o peso em pelo menos 2 dias para ver o gráfico.</p>';
 const v=a.map(x=>x[1]),all=tw?[...v,tw]:v,mn=Math.min(...all)-1,mx=Math.max(...all)+1,X=i=>10+i*280/(a.length-1),Y=x=>100-(x-mn)/(mx-mn)*90;
 return`<svg viewBox="0 0 300 110" class="ch"><polyline class="ln" points="${v.map((x,i)=>X(i)+','+Y(x)).join(' ')}"/>${tw?`<line class="tl" x1="10" x2="290" y1="${Y(tw)}" y2="${Y(tw)}"/>`:''}${v.map((x,i)=>`<circle class="dt" cx="${X(i)}" cy="${Y(x)}" r="3"/>`).join('')}</svg><div class="mu sm">${v[0]} kg → ${v[v.length-1]} kg${tw?' · meta '+tw+' kg':''}</div>`}
const F=(l,key,t,v)=>`<label>${l}</label><input type="${t||'number'}" inputmode="decimal" step="any" value="${v??S.cfg[key]??''}" onchange="sc('${key}',this.value)">`;

function T0(){const c=calc(),d=S.days[sel],m=d?d.min:0,g=(d&&d.g)||S.cfg.goal,p=Math.min(m/g,1),C=339.3,isT=sel===today(),run=S.timer&&S.timer.s;
 const lbl=isT?'Hoje':new Date(sel+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'});
 return`<div class="cd c"><div class="sm mu">${lbl}</div>
<svg viewBox="0 0 130 130" width="180"><circle class="rb" cx="65" cy="65" r="54"/><circle class="rf" cx="65" cy="65" r="54" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 65 65)"/><text x="65" y="70" text-anchor="middle" font-size="28" font-weight="800" fill="currentColor">${m}</text><text x="65" y="88" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">de ${g} min</text></svg>
<div>${m>=g?'🎉 Meta batida! Ótimo trabalho!':m>=g/2?'Mais da metade! Faltam '+(g-m)+' min':'Faltam '+(g-m)+' min. Cada passo conta 👟'}</div>${d&&d.km?`<div class="sm mu">${d.km.toFixed(1)} km</div>`:''}
${isT?'':'<button class="g" style="margin-top:8px" onclick="go(today())">Voltar para hoje</button>'}</div>
<div class="cd"><h2>⏱️ Cronômetro da caminhada</h2><div class="big c" id="tm">00:00</div><button style="width:100%" onclick="tg()">${run?'⏹ Finalizar e salvar':'▶ Iniciar caminhada'}</button></div>
<div class="cd"><h2>➕ Registrar ${isT?'hoje':'neste dia'}</h2><div class="row">${[5,10,15,30].map(x=>`<button class="g" onclick="add(${x})">+${x}</button>`).join('')}</div>
<div class="row" style="margin-top:8px"><input id="cm" type="number" inputmode="numeric" placeholder="minutos"><input id="ck" type="number" inputmode="decimal" placeholder="km (opcional)"></div>
<button style="width:100%;margin-top:8px" onclick="ad()">Adicionar</button>${d?'<button class="g" style="width:100%;margin-top:8px" onclick="ask(\'z\',zr,this)">Zerar este dia</button>':''}</div>
<div class="cd"><h2>⚖️ Peso</h2><div class="row"><input id="wi" type="number" inputmode="decimal" step="0.1" placeholder="kg" value="${S.weights[sel]||''}"><button onclick="pw()">Salvar peso</button></div></div>`}

function T1(){const c=calc(),w=ws(),[ch,hits]=cal(),mg=S.cfg.mg||20,b=new Date();b.setDate(1);b.setMonth(b.getMonth()+vm);const into=c.pts%300;
 return`<div class="cd"><div class="row c"><div><div class="big">🔥 ${c.st}</div><div class="sm mu">dias de ofensiva</div></div><div><div class="big">🏅 ${c.best}</div><div class="sm mu">recorde</div></div></div>${c.st?'':'<div class="sm mu c" style="margin-top:6px">Bata a meta hoje para acender sua chama!</div>'}</div>
<div class="cd"><h2>⭐ Nível ${c.lvl} · ${LV[Math.min(c.lvl-1,5)]}</h2><div class="bar"><i style="width:${into/3}%"></i></div><div class="sm mu" style="margin-top:4px">${c.pts} pts · faltam ${300-into} para o próximo nível<br>1 pt/min + 20 por meta batida + bônus de ofensiva</div></div>
<div class="cd"><div class="row" style="align-items:center"><button class="g" style="flex:0 0 52px" onclick="mv(-1)">‹</button><h2 style="margin:0;text-align:center;flex:3;text-transform:capitalize">${b.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button class="g" style="flex:0 0 52px" onclick="mv(1)" ${vm>=0?'disabled':''}>›</button></div>
<div class="sm" style="margin:8px 0 4px">Desafio do mês: <b>${hits}/${mg} dias</b> ${hits>=mg?'🏆 Concluído!':''}</div><div class="bar"><i style="width:${Math.min(hits/mg,1)*100}%"></i></div><div style="height:10px"></div>${ch}<div class="sm mu" style="margin-top:6px">Toque em um dia para registrar ou editar (útil para lançar caminhadas passadas).</div></div>
<div class="cd"><h2>🏆 Conquistas</h2><div class="bd">${BD.map(x=>`<div class="${x[2](c,w)?'ok':''}"><span>${x[0]}</span>${x[1]}</div>`).join('')}</div></div>`}

function T2(){const c=calc(),w=ws(),g=S.cfg.goal,tw=+S.cfg.tw,h=+S.cfg.h,
 L=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return[d,S.days[k(d)]]}),h7=L.filter(x=>hit(x[1])).length,
 imc=h&&w.cur?w.cur/((h/100)**2):0,pct=tw&&w.sw>tw?Math.min(w.lost/(w.sw-tw),1)*100:-1;
 return`<div class="cd"><div class="row c"><div><div class="big">${Math.floor(c.tot/60)}h${pad(c.tot%60)}</div><div class="sm mu">tempo total</div></div><div><div class="big">${Object.keys(S.days).length}</div><div class="sm mu">dias</div></div><div><div class="big">${c.km.toFixed(0)}</div><div class="sm mu">km</div></div></div></div>
<div class="cd"><h2>Últimos 7 dias</h2><div class="wk">${L.map(([d,r])=>`<div class="${hit(r)?'h':''}"><i style="height:${Math.min((r?r.min:0)/g,1.2)*80}px"></i>${d.toLocaleDateString('pt-BR',{weekday:'narrow'})}</div>`).join('')}</div></div>
<div class="cd"><h2>🎯 Progressão da meta</h2>${h7>=6&&g<90?`<p>Você bateu a meta em ${h7} dos últimos 7 dias. Pronto para o próximo nível?</p><button onclick="up()">Subir para ${g+5} min/dia</button>`:`<p class="mu" style="margin:0">Meta atual: ${g} min/dia. Bata a meta em 6 de 7 dias (você está em ${h7}) para liberar +5 min.</p>`}</div>
<div class="cd"><h2>⚖️ Peso</h2>${w.cur?`<div class="sm">${w.lost>0?'Já perdeu <b>'+w.lost+' kg</b>':'Registre seu peso para acompanhar'}${pct>=0?' · '+Math.round(pct)+'% da meta':''}</div>`:'<p class="mu sm">Registre seu peso na aba Hoje.</p>'}${pct>=0?`<div class="bar" style="margin:6px 0"><i style="width:${pct}%"></i></div>`:''}${wch(w.a,tw)}${imc?`<div class="sm mu">IMC ${imc.toFixed(1)} · ${imc<18.5?'abaixo do peso':imc<25?'normal':imc<30?'sobrepeso':'obesidade'}</div>`:''}</div>`}

function T3(){return`<div class="cd"><h2>🎯 Metas</h2>${F('Meta diária (minutos)','goal')}${F('Desafio do mês (dias com meta batida)','mg')}${F('Peso inicial (kg)','sw')}${F('Peso desejado (kg)','tw')}${F('Altura (cm)','h')}</div>
<div class="cd"><h2>🔔 Lembretes</h2><p class="sm mu" style="margin:0">Os avisos aparecem com o app aberto (mensagem na tela, vibração, som e notificação do navegador quando permitida). Às 20:30 aviso se sua ofensiva estiver em risco.</p>${F('Lembrete 1','r0','time',S.cfg.r[0])}${F('Lembrete 2','r1','time',S.cfg.r[1])}
<div class="row" style="margin-top:10px"><button onclick="tn()">${S.cfg.n?'🔕 Desativar avisos':'🔔 Ativar avisos'}</button><button class="g" onclick="notify('Passo a Passo','Teste: avisos funcionando ✅')">Testar</button></div></div>
<div class="cd"><h2>💾 Backup e outros aparelhos</h2><p class="sm mu" style="margin:0 0 8px">Exporte para guardar ou levar seus dados a outro aparelho e importe lá o arquivo. A importação mescla com os dados existentes (mantém o maior tempo de cada dia).</p><button style="width:100%" onclick="ex()">⬇️ Exportar backup</button>
<label>Importar arquivo de backup (.json)</label><input type="file" accept=".json,application/json" onchange="fi(this)"><label>Ou cole aqui o texto do backup</label><textarea id="bk" rows="3"></textarea><button class="g" style="width:100%;margin-top:8px" onclick="imp($('bk').value)">Importar texto</button></div>
<div class="cd"><button class="g" style="width:100%" onclick="ask('r',rs,this)">🗑️ Apagar todos os dados</button><p class="sm mu" style="margin:8px 0 0">Dica: no Chrome do Android, menu ⋮ → “Adicionar à tela inicial”.</p></div>`}

function render(){$('m').innerHTML=[T0,T1,T2,T3][tab]();const c=calc();$('st').textContent='🔥 '+c.st;$('pt').textContent='⭐ '+c.pts;
 document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('on',i===tab));tick()}
const nv=i=>{tab=i;render();scrollTo(0,0)},go=d=>{sel=d;nv(0)},mv=n=>{vm=Math.min(vm+n,0);render()};
render();setInterval(tick,1000);setInterval(chk,20000);document.addEventListener('visibilitychange',chk);chk();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
