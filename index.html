.ti{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 17%,transparent);color:var(--c)}
.tv{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.05;white-space:nowrap}.tv small{font-size:13.5px;font-weight:600;color:var(--mu);margin-left:4px;letter-spacing:0}
.tk{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);line-height:1.2}.tv2{font-size:12.5px;color:var(--mu);margin-top:4px}
.gh .gn{margin-left:auto;order:3;color:var(--tx);letter-spacing:.04em}.gh{gap:10px}.mg{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:2px}.mg>.mi{flex:0 0 calc((100% - 16px)/3);min-width:0}.mi.inf{justify-content:center}.ib{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);box-sizing:border-box}.mv small{font-size:12px;font-weight:600;color:var(--mu)}.mi.inf .mv small{font-size:12px;font-weight:600;color:var(--mu)}
.mi{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 4px 12px;border-radius:20px;background:var(--in);border:0;min-width:0;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;transition:transform .45s cubic-bezier(.34,1.8,.5,1)}.mi:active{transform:scale(.92);transition-duration:.12s}.mi:focus-visible{outline:2px solid var(--c);outline-offset:3px}.mi.dn{background:color-mix(in srgb,var(--c) 10%,var(--in))}
.mi.pop{animation:mpop .85s linear both}
@keyframes mpop{0%{transform:scale(.9)}16%{transform:scale(1.09)}32%{transform:scale(.97)}48%{transform:scale(1.035)}64%{transform:scale(.992)}80%{transform:scale(1.008)}100%{transform:scale(1)}}
.ml{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-top:4px}.mv{font-size:17px;font-weight:700;letter-spacing:-.01em}.mi.dn .mv{color:var(--c)}
.dg{flex:0 0 28px;touch-action:none;cursor:grab;color:var(--mu);font-style:normal;font-size:20px;line-height:1;text-align:center;padding:8px 0;user-select:none;-webkit-user-select:none}.dg:active{cursor:grabbing;color:var(--pr)}.ord{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--tr);transition:transform .22s cubic-bezier(.16,1,.3,1);background:transparent;border-radius:12px}.ord.off span{opacity:.45;text-decoration:line-through}.eyeb{flex:0 0 44px;display:grid;place-items:center;padding:8px 0}.sub{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:14px 0 2px}.ord.drg{position:relative;z-index:3;transition:none;background:color-mix(in srgb,var(--pr) 14%,var(--cd));box-shadow:0 10px 26px rgba(0,0,0,.25)}.ord:last-of-type{border-bottom:0}.ord span{flex:1;font-size:15px;font-weight:500;min-width:0}.ord button{flex:0 0 44px;padding:8px 0;font-size:17px}.ord button:disabled{opacity:.3}
.gxw{margin:12px 0 0}.gxw .f1{display:block;font-size:20px;line-height:1.25;font-weight:600;letter-spacing:-.015em;color:var(--tx)}.gxw .f2{display:block;font-size:16.5px;line-height:1.4;font-weight:500;color:var(--tx);opacity:.82;margin-top:4px}
.ths .thg{grid-column:1/-1;margin:10px 0 0;font-size:11px;letter-spacing:.14em}
.th{background:transparent;border:0;box-shadow:none;padding:6px 2px;color:var(--tx);overflow:visible;min-width:0;font-size:11.5px;white-space:nowrap}.th::after{display:none}.th i{border:0;box-shadow:0 0 0 2px color-mix(in srgb,var(--tx) 30%,transparent)}.th.on{border:0;box-shadow:none}.th.on i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--pr)}
.lite *,.lite *::before,.lite *::after{animation:none!important;transition:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.lite body::before{display:none}
.lite body{background:var(--bg)}
.lite .cd{background:color-mix(in srgb,var(--bg) 86%,var(--tx) 8%);box-shadow:none;border-color:var(--tr)}
.lite .cd::after,.lite .gl,.lite .rsh,.lite .rso{display:none}
.lite nav,.lite .chip{background:color-mix(in srgb,var(--bg) 90%,var(--tx) 6%)}
.lite #ov{background:rgba(0,0,0,.62)}
.lite #ovc,.lite #walk{background:var(--bg)}
.lite #dc{box-shadow:0 2px 10px rgba(0,0,0,.25)}
.gd{font-size:13px;margin-top:6px;opacity:.88}

[data-arw]{display:inline-grid;place-items:center;font-size:28px;line-height:1;padding:0;min-height:52px;text-align:center}
/* hover de botões */
button:not(:disabled){transition:box-shadow .35s ease-out,filter .3s ease-out,background-color .35s ease-out,color .35s ease-out}
button:not(:disabled):hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 22%,transparent);filter:brightness(1.05)}
nav button:not(:disabled):hover{box-shadow:none;filter:none}
.g:not(:disabled):hover{background:color-mix(in srgb,var(--pr) 12%,transparent);color:var(--tx);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 16%,transparent)}
button.eyeb:not(:disabled):hover,.dg:hover{box-shadow:none}
button:not(:disabled):focus-visible{outline:2px solid var(--pr);outline-offset:2px}
</style>
