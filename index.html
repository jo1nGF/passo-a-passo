function T1(){const c=calc(),w=ws(),[ch,hits]=cal(),mg=S.cfg.mg||20,b=new Date();b.setDate(1);b.setMonth(b.getMonth()+vm);const into=c.pts%300;
 return`<div class="cd"><div class="row c"><div><div class="big">🔥 <span data-cu="${c.st}" data-k="st1">${c.st}</span></div><div class="sm mu">dias de ofensiva</div></div><div><div class="big">🏅 <span data-cu="${c.best}" data-k="best1">${c.best}</span></div><div class="sm mu">recorde</div></div></div>${c.st?'':'<div class="sm mu c" style="margin-top:6px">Bata a meta hoje para acender sua chama!</div>'}</div>
<div class="cd"><h2>⭐ Nível ${c.lvl} · ${LV[Math.min(c.lvl-1,5)]}</h2><div class="bar"><i style="width:${into/3}%"></i></div><div class="sm mu" style="margin-top:4px"><span data-cu="${c.pts}" data-k="pts1">${c.pts}</span> pts · faltam ${300-into} para o próximo nível<br>1 pt/min + 20 por meta batida + bônus de ofensiva</div></div>
<div class="cd"><div class="row" style="align-items:center"><button class="g" style="flex:0 0 52px" onclick="mv(-1)">‹</button><h2 class="cap" style="margin:0;text-align:center;flex:3">${b.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button class="g" style="flex:0 0 52px" onclick="mv(1)" ${vm>=0?'disabled':''}>›</button></div>
<div class="sm" style="margin:8px 0 4px">Desafio do mês: <b><span data-cu="${hits}" data-k="hits1">${hits}</span>/${mg} dias</b> ${hits>=mg?'🏆 Concluído!':''}</div><div class="bar"><i style="width:${Math.min(hits/mg,1)*100}%"></i></div><div style="height:10px"></div>${ch}<div class="sm mu" style="margin-top:6px">Toque em um dia para registrar ou editar (útil para lançar caminhadas passadas).</div></div>
<div class="cd"><h2>🏆 Conquistas</h2><div class="bd">${BD.map(x=>`<div class="${x[2](c,w)?'ok':''}"><span>${x[0]}</span>${x[1]}</div>`).join('')}</div></div>`}

function T2(){const c=calc(),w=ws(),g=S.cfg.goal,tw=+S.cfg.tw,h=+S.cfg.h,
 L=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return[d,S.days[k(d)]]}),h7=L.filter(x=>hit(x[1])).length,
 imc=h&&w.cur?w.cur/((h/100)**2):0,pct=tw&&w.sw>tw?Math.min(w.lost/(w.sw-tw),1)*100:-1;
 return`<div class="cd"><div class="row c"><div><div class="big" data-cu="${c.tot}" data-t="t" data-k="tot2">${Math.floor(c.tot/60)}h${pad(c.tot%60)}</div><div class="sm mu">tempo total</div></div><div><div class="big" data-cu="${Object.keys(S.days).length}" data-k="days2">${Object.keys(S.days).length}</div><div class="sm mu">dias</div></div><div><div class="big" data-cu="${c.km}" data-d="1" data-k="km2">${c.km.toFixed(1)}</div><div class="sm mu">km</div></div></div></div>
<div class="cd"><div class="row" style="align-items:center;flex-wrap:nowrap;margin-bottom:8px"><h2 style="margin:0;flex:1">Histórico</h2><div class="seg" style="flex:0 0 auto"><button class="g on">7 dias</button><button class="g" onclick="ovo()">Todo período</button></div></div>${wkc(L,r=>r?r.min:0,v=>v,g)}<div class="sm mu" style="margin-top:6px"><span class="lg b0"></span>abaixo da meta<span class="lg b1"></span>meta batida<span class="lg b2"></span>além da meta · linha tracejada = meta</div></div>
${dk(L)}
<div class="cd"><h2>🎯 Progressão da meta</h2>${h7>=6&&g<90?`<p>Você bateu a meta em ${h7} dos últimos 7 dias. Pronto para o próximo nível?</p><button onclick="up()">Subir para ${g+5} min/dia</button>`:`<p class="mu" style="margin:0">Meta atual: ${g} min/dia. Bata a meta em 6 de 7 dias (você está em ${h7}) para liberar +5 min.</p>`}</div>
<div class="cd"><h2>⚖️ Peso</h2>${w.cur?`<div class="sm">${w.lost>0?'Já perdeu <b>'+w.lost+' kg</b>':'Registre seu peso para acompanhar'}${pct>=0?' · '+Math.round(pct)+'% da meta':''}</div>`:'<p class="mu sm">Registre seu peso na aba Hoje.</p>'}${pct>=0?`<div class="bar" style="margin:6px 0"><i style="width:${pct}%"></i></div>`:''}${wch(w.a,tw)}${imc?`<div class="sm mu">IMC ${imc.toFixed(1)} · ${imc<18.5?'abaixo do peso':imc<25?'normal':imc<30?'sobrepeso':'obesidade'}</div>`:''}</div>`}

function T3(){return`<div class="cd"><h2>👤 Seu nome</h2><p class="sm mu" style="margin:0">Usado nas mensagens de incentivo.</p>${F('Como quer ser chamado(a)?','name','text')}</div>
<div class="cd"><h2>🎨 Tema</h2><div class="ths">${TH.map(t=>`<button class="th${(S.cfg.theme||'auto')===t[0]?' on':''}" onclick="sth('${t[0]}')"><i style="background:linear-gradient(135deg,${t[2]} 50%,${t[3]} 50%)"></i>${t[1]}</button>`).join('')}</div></div>
<div class="cd"><h2>🎯 Metas</h2>${F('Meta diária (minutos)','goal')}${F('Desafio do mês (dias com meta batida)','mg')}${F('Peso inicial (kg)','sw')}${F('Peso desejado (kg)','tw')}${F('Altura (cm)','h')}</div>
<div class="cd"><h2>📍 Distância (GPS)</h2><p class="sm mu" style="margin:0 0 8px">Ao iniciar o cronômetro, o app mede os km pelo GPS do celular e soma ao dia quando você finaliza. Mantenha o app aberto e a tela ligada: com a tela apagada ou o app em segundo plano o Android pausa o GPS (o app tenta manter a tela acesa sozinho). Sua localização não sai do aparelho. Sem sinal ou dentro de casa, informe os km manualmente.</p><button class="g" style="width:100%" onclick="tgps()">${S.cfg.gps?'📡 GPS ligado (toque para desligar)':'📡 GPS desligado (toque para ligar)'}</button><button class="g" style="width:100%;margin-top:8px" onclick="tgt()">🧪 Testar GPS agora</button></div>
<div class="cd"><h2>🔔 Lembretes</h2><p class="sm mu" style="margin:0">Os avisos aparecem com o app aberto (mensagem na tela, vibração, som e notificação do navegador quando permitida). Às 20:30 aviso se sua ofensiva estiver em risco.</p>${F('Lembrete 1','r0','time',S.cfg.r[0])}${F('Lembrete 2','r1','time',S.cfg.r[1])}
<div class="row" style="margin-top:10px"><button onclick="tn()">${S.cfg.n?'🔕 Desativar avisos':'🔔 Ativar avisos'}</button><button class="g" onclick="notify('Passo a Passo','Teste: avisos funcionando ✅')">Testar</button></div></div>
<div class="cd"><h2>💾 Backup e outros aparelhos</h2><p class="sm mu" style="margin:0 0 8px">Exporte para guardar ou levar seus dados a outro aparelho e importe lá o arquivo. A importação mescla com os dados existentes (mantém o maior tempo de cada dia).</p><button style="width:100%" onclick="ex()">⬇️ Exportar backup</button>
<label>Importar arquivo de backup (.json)</label><input type="file" accept=".json,application/json" onchange="fi(this)"><label>Ou cole aqui o texto do backup</label><textarea id="bk" rows="3"></textarea><button class="g" style="width:100%;margin-top:8px" onclick="imp($('bk').value)">Importar texto</button></div>
<div class="cd"><button class="g" style="width:100%" onclick="ask('r',rs,this)">🗑️ Apagar todos os dados</button><p class="sm mu" style="margin:8px 0 0">Dica: no Chrome do Android, menu ⋮ → “Adicionar à tela inicial”.</p></div>`}

function render(a){unpick();ap();$('m').innerHTML=[T0,T1,T2,T3][tab]();const c=calc();chips(c,a);
 document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('on',i===tab));$('ni').style.transform='translateX('+tab*100+'%)';tick();if(a)intro();else post()}
const go=d=>{sel=d;nv(0)},mv=n=>{vm=Math.min(vm+n,0);render();calAnim($('m'),0)};
render(1);setInterval(tick,1000);setInterval(chk,20000);document.addEventListener('visibilitychange',()=>{chk();if(!document.hidden&&S.timer&&S.timer.s&&S.cfg.gps){wake();if(Date.now()-G.t>15000){gpsOff();gpsOn()}}});chk();if(S.timer&&S.timer.s)gpsOn();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
